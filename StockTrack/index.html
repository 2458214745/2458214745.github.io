function sortList(list, st){
  var a = list.slice();
  if(!st.key) return a;
  a.sort(function(x,y){
    var vx = x[st.key], vy = y[st.key];
    if(vx === null || vx === undefined) return 1;
    if(vy === null || vy === undefined) return -1;
    if(typeof vx === 'string') return st.asc ? vx.localeCompare(vy) : vy.localeCompare(vx);
    return st.asc ? vx - vy : vy - vx;
  });
  return a;
}
function num(v){ return v === null ? '<span class="void">\u2014</span>' : v.toFixed(2); }
function pctCell(p, live){
  if(p === null) return '<span class="void">\u2014</span>';
  return '<span class="' + (p >= 0 ? 'rise' : 'fall') + (live ? ' live' : '') + '">' +
         (p >= 0 ? '+' : '') + p.toFixed(1) + '%</span>';
}
function moneyCell(v){
  if(v === null) return '<span class="void">\u2014</span>';
  return '<span class="' + (v >= 0 ? 'rise' : 'fall') + '">' +
         (v >= 0 ? '+' : '') + v.toFixed(2) + '</span>';
}
function dayCell(v, base, isLive){
  if(v === null) return '<span class="void">\u2014</span>';
  var cls = '';
  if(base !== null && isFinite(base) && base > 0){
    if(v > base) cls = 'rise';
    else if(v < base) cls = 'fall';
  }
  if(isLive) cls = cls ? cls + ' live' : 'live';
  if(!cls) return v.toFixed(2);
  return '<span class="' + cls + '">' + v.toFixed(2) + '</span>';
}
function dayVal(r, i){
  if(r.status === 'hold' && r.live === i){
    var q = qnow(r.code);
    return (q !== null && q > 0) ? q : null;
  }
  return i === 0 ? r.d1 : (i === 1 ? r.d2 : r.d3);
}
function dayCellOf(r, i){ return dayCell(dayVal(r, i), r.buy, usingLive(r) && r.live === i); }
function usingLive(r){
  if(r.status !== 'hold' || r.live === null || r.live === undefined) return false;
  var q = qnow(r.code);
  return q !== null && q > 0;
}
function lastPrice(r){
  var last = dayVal(r, 2);
  if(last === null) last = dayVal(r, 1);
  if(last === null) last = dayVal(r, 0);
  return last;
}
function tradeRel(r){
  var last = lastPrice(r);
  var base = r.buy;
  if(last === null || base === null || base === undefined || !isFinite(base) || base <= 0) return null;
  return (last / base - 1) * 100;
}
function tradeChgBp(r){
  var last = lastPrice(r);
  var base = r.bp;
  if(last === null || base === null || base === undefined || !isFinite(base) || base <= 0) return null;
  return (last / base - 1) * 100;
}
function bpCell(v){
  if(v === null || v === undefined) return '<span class="void">\u2014</span>';
  var s = String(v);
  if(s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s;
}
function bandCell(r){
  if(r.bandLo === null) return '<span class="void">\u2014</span>';
  return r.bandLo.toFixed(2) + '~' + r.hi.toFixed(2);
}
function setSortMark(tableId, st){
  var ths = document.querySelectorAll('#' + tableId + ' th[data-sort]');
  for(var i = 0; i < ths.length; i++){
    var th = ths[i];
    th.classList.remove('sort-asc');
    th.classList.remove('sort-desc');
    if(st.key && th.dataset.sort === st.key){
      th.classList.add(st.asc ? 'sort-asc' : 'sort-desc');
    }
  }
}
function renderWatch(){
  var tb = document.getElementById('watchBody');
  var list = sortList(WATCH, watchSort);
  var html = '', trig = 0, brk = 0, core = 0;
  for(var i = 0; i < list.length; i++){
    var r = list[i];
    var inBand = (r.now !== null && r.lo !== null && r.hi !== null &&
                  r.now >= r.bandLo && r.now <= r.hi);
    var broken = (r.now !== null && r.preLow !== null && r.now < r.preLow);
    if(inBand) trig++;
    if(broken) brk++;
    if(r.level === 'core') core++;
    var cls = inBand ? ' class="tr-trigger"' : (broken ? ' class="tr-break"' : '');
    html += '<tr' + cls + '>' +
      '<td>' + r.idx + '</td>' +
      '<td><a class="code" href="' + r.url + '" target="_blank" rel="noopener">' + r.code + '</a></td>' +
      '<td>' + r.name + '</td>' +
      '<td><span class="badge ' + (r.level === 'core' ? 'badge-core' : 'badge-relax') + '">' + r.levelTxt + '</span></td>' +
      '<td>' + num(r.close) + '</td>' +
      '<td>' + num(r.now) + '</td>' +
      '<td>' + pctCell(r.chg) + '</td>' +
      '<td>' + bandCell(r) + '</td>' +
      '<td class="rise">' + num(r.stop) + '</td>' +
      '<td>' + num(r.preLow) + '</td>' +
      '<td>' + pctCell(r.five) + '</td>' +
      '<td>' + pctCell(r.dev) + '</td>' +
      '<td>' + (r.cap === null ? '<span class="void">\u2014</span>' : r.cap.toFixed(0)) + '</td>' +
      '<td>' + (r.pos === null ? '<span class="void">\u2014</span>' : r.pos.toFixed(2)) + '</td>' +
      '</tr>';
  }
  tb.innerHTML = html;
  document.getElementById('watchTotal').textContent = list.length;
  document.getElementById('triggerCount').textContent = trig;
  document.getElementById('breakCount').textContent = brk;
  document.getElementById('coreCount').textContent = core;
  setSortMark('watchTable', watchSort);
}
function renderTrade(){
  var tb = document.getElementById('tradeBody');
  var list = sortList(TRADE, tradeSort);
  var html = '', hold = 0, cut = 0, sum = 0;
  for(var i = 0; i < list.length; i++){
    var r = list[i];
    if(r.status === 'hold') hold++; else cut++;
    if(r.pnl !== null) sum += r.pnl;
    var cls = r.status === 'hold' ? ' class="tr-holding"' : '';
    var badge = r.status === 'hold'
      ? '<span class="badge badge-hold">' + r.statusText + '</span>'

      '<td>' + dayCellOf(r, 0) + '</td>' +
      '<td>' + dayCellOf(r, 1) + '</td>' +
      '<td>' + dayCellOf(r, 2) + '</td>' +
      '<td>' + pctCell(tradeRel(r), usingLive(r)) + '</td>' +
      '<td>' + bpCell(r.bp) + '</td>' +
      '<td>' + bpCell(r.sp) + '</td>' +
      '<td>' + moneyCell(r.pnl) + '</td>' +
      '</tr>';
  }
  tb.innerHTML = html;
  document.getElementById('tradeTotal').textContent = list.length;
  document.getElementById('holdingCnt').textContent = hold;
  document.getElementById('cutCnt').textContent = cut;
  document.getElementById('pnlSum').textContent = (sum >= 0 ? '+' : '') + sum.toFixed(2);
  document.getElementById('pnlSum').className = sum >= 0 ? 'rise' : 'fall';
  setSortMark('tradeTable', tradeSort);
}

var QMAP = {};
function bindSort(tableId, st, renderFn){
  var ths = document.querySelectorAll('#' + tableId + ' th[data-sort]');
  for(var i = 0; i < ths.length; i++){
    (function(th){
      th.onclick = function(){
        var key = th.dataset.sort;
        if(st.key === key) st.asc = !st.asc;
        else { st.key = key; st.asc = true; }
        renderFn();
      };
    })(ths[i]);
  }
}

  var d = new Date();
  function p(n){ return (n < 10 ? '0' : '') + n; }
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

function emSec(code){
  var c = code.charAt(0);
  if(c === '6') return '1.' + code;
  if(c === '4' || c === '8') return null;
  return '0.' + code;
}
function txPrefix(code){
  var c = code.charAt(0);
  if(c === '6') return 'sh' + code;
  if(c === '4' || c === '8') return 'bj' + code;
  return 'sz' + code;
}

  var hit = 0;
  for(var i = 0; i < WATCH.length; i++){
    var r = WATCH[i], q = map[r.code];
    if(!q) continue;
    if(q.now !== null && q.now > 0) r.now = q.now;
    if(q.chg !== null && q.chg !== undefined) r.chg = q.chg;
    hit++;
  }
  for(var j = 0; j < TRADE.length; j++){
    var t = TRADE[j], tq = map[t.code];
    if(tq && t.status === 'hold'){ t.now = (tq.now !== null && tq.now > 0) ? tq.now : null; hit++; }
  }
  return hit;
}
function quoteCodes(){
  var codes = [], seen = {};
  function add(c){ if(!c || seen[c]) return; seen[c] = 1; codes.push(c); }
  for(var i = 0; i < WATCH.length; i++) add(WATCH[i].code);
  for(var j = 0; j < TRADE.length; j++) if(TRADE[j].status === 'hold') add(TRADE[j].code);
  return codes;
}
function qnow(code){
  if(typeof QMAP === 'object' && QMAP && QMAP[code]) return QMAP[code].now;
  return null;
}
function txFallback(codes){
  if(!codes.length){ setStamp('快照价（无可用代码）', true); return; }
  var qs = [];
  for(var i = 0; i < codes.length; i++) qs.push(txPrefix(codes[i]));
  var sc = document.createElement('script');
  sc.charset = 'gbk';
  sc.src = 'https://qt.gtimg.cn/q=' + qs.join(',') + '&_=' + new Date().getTime();
  sc.onload = function(){
    var map = {}, n = 0;
    for(var i = 0; i < codes.length; i++){
      var raw = window['v_' + txPrefix(codes[i])];
      if(!raw) continue;
      var f = String(raw).split('~');
      var nv = parseFloat(f[3]), pc = parseFloat(f[4]);
      if(!isFinite(nv) || nv <= 0) continue;
      map[codes[i]] = {now: nv, chg: (isFinite(pc) && pc > 0) ? (nv / pc - 1) * 100 : null};
      n++;
    }
    QMAP = map;
    if(n){ applyQuotes(map); renderWatch(); renderTrade(); setStamp('实时价 ' + hhmmss()); }
    else { setStamp('快照价（实时获取失败）', true); }
    if(sc.parentNode) sc.parentNode.removeChild(sc);
  };
  sc.onerror = function(){
    setStamp('快照价（实时获取失败）', true);
    if(sc.parentNode) sc.parentNode.removeChild(sc);
  };
  document.head.appendChild(sc);
}
function refreshQuotes(){
  setStamp('实时价拉取中…');
  var codes = quoteCodes(), secids = [];
  for(var i = 0; i < codes.length; i++){
    var s = emSec(codes[i]);
    if(s) secids.push(s);
  }
  if(!secids.length){ txFallback(codes); return; }
  var url = 'https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&fields=f2,f3,f12'
          + '&secids=' + secids.join(',') + '&_=' + new Date().getTime();
  fetch(url, {cache: 'no-store'})
    .then(function(res){ return res.json(); })
    .then(function(j){
      var diff = (j && j.data && j.data.diff) || [];
      var map = {};
      for(var k = 0; k < diff.length; k++){
        var d = diff[k];
        map[d.f12] = {
          now: (typeof d.f2 === 'number') ? d.f2 : null,
          chg: (typeof d.f3 === 'number') ? d.f3 : null
        };
      }
      QMAP = map;
      var hit = applyQuotes(map);
      if(hit){ renderWatch(); renderTrade(); setStamp('实时价 ' + hhmmss()); }
      else { txFallback(codes); }
    })
    .catch(function(){ txFallback(codes); });
}
refreshQuotes();
